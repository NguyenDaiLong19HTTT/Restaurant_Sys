server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: http:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  resolver 127.0.0.11 valid=5s ipv6=off;
  location = /api/v1/payments/vnpay/ipn { access_log off; set $gateway http://api-gateway:3000; proxy_pass $gateway$request_uri; }
  location = /app/thanh-toan/ket-qua { access_log off; try_files $uri /index.html; }
  location /api/ { set $gateway http://api-gateway:3000; proxy_pass $gateway$request_uri; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Real-IP $remote_addr; client_max_body_size 32k; }
  location /internal/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
