        "DB_USER": "order_app",
        "DB_PASSWORD_FILE": "/run/secrets/order_db",
        "SEED_DEMO": "true",
        "RESERVATION_BASE_URL": "http://reservation-service:3000",
        "MENU_BASE_URL": "http://menu-service:3000",
        "PAYMENT_BASE_URL": "http://payment-service:3000"
      },
      "secrets": [
        "order_db",
        "jwt_public",
        "service_token"
      ],
      "networks": [
        "data",
        "backend"
