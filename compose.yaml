        "data",
        "backend"
      ],
      "restart": "no"
    },
    "menu-tests": {
      "build": ".",
      "profiles": [
        "test"
      ],
      "command": [
        "node",
        "--test",
        "--test-concurrency=1",
        "tests/integration.test.mjs"
      ],
      "environment": {
        "API_BASE_URL": "http://api-gateway:3000",
        "MENU_BASE_URL": "http://menu-service:3000",
        "DEMO_PASSWORD_FILE": "/run/secrets/login_password",
        "INTERNAL_SERVICE_TOKEN_FILE": "/run/secrets/service_token"
      },
      "secrets": [
        "login_password",
        "service_token"
      ],
      "networks": [
