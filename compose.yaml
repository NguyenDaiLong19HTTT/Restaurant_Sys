{
  "name": "${COMPOSE_PROJECT_NAME}",
  "services": {
    "mysql": {
      "image": "mysql:8.4",
      "environment": {
        "MYSQL_ROOT_PASSWORD_FILE": "/run/secrets/root_password"
      },
      "secrets": [
        "root_password"
      ],
      "volumes": [
        "integrated_data:/var/lib/mysql"
      ],
      "networks": [
        "data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$(cat /run/secrets/root_password)\" mysql -h 127.0.0.1 -uroot -e \"SELECT 1\" >/dev/null 2>&1"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 45
      },
      "restart": "unless-stopped",
      "command": [
        "--log-bin-trust-function-creators=1"
      ]
    },
    "db-init": {
      "build": ".",
      "command": [
        "node",
        "scripts/bootstrap-integrated.mjs"
      ],
      "environment": {
        "DB_HOST": "mysql"
      },
      "secrets": [
        "root_password",
        "identity_db",
        "menu_db",
        "payment_db",
        "reservation_db",
        "inventory_db",
        "staff_db",
        "schedule_db",
        "order_db"
      ],
      "networks": [
        "data"
      ],
      "depends_on": {
        "mysql": {
          "condition": "service_healthy"
        }
      },
      "restart": "no"
    },
    "identity-service": {
      "build": ".",
      "command": [
        "node",
        "scripts/run.cjs",
        "identity"
      ],
      "environment": {
        "AUTH_MODE": "identity",
        "NODE_ENV": "development",
        "JWT_PUBLIC_KEY_FILE": "/run/secrets/jwt_public",
        "JWT_ISSUER": "restaurant-integrated",
        "JWT_AUDIENCE": "restaurant-api",
        "IDENTITY_INTROSPECTION_URL": "http://identity-service:3000/api/v1/auth/me",
        "INTERNAL_SERVICE_TOKEN_FILE": "/run/secrets/service_token",
        "PORT": 3000,
        "DB_HOST": "mysql",
        "DB_NAME": "identity_db",
        "DB_USER": "identity_app",
        "DB_PASSWORD_FILE": "/run/secrets/identity_db",
        "JWT_PRIVATE_KEY_FILE": "/run/secrets/jwt_private",
        "SEED_DEMO": "true",
        "IDENTITY_BASE_URL": "http://identity-service:3000"
      },
      "secrets": [
        "identity_db",
        "jwt_public",
        "service_token",
        "jwt_private",
        "login_password"
      ],
      "networks": [
        "data",
        "backend"
      ],
      "depends_on": {
        "db-init": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "menu-service": {
      "build": ".",
      "command": [
        "node",
        "services/menu/src/server.mjs"
      ],
      "environment": {
        "AUTH_MODE": "identity",
        "NODE_ENV": "development",
        "JWT_PUBLIC_KEY_FILE": "/run/secrets/jwt_public",
        "JWT_ISSUER": "restaurant-integrated",
        "JWT_AUDIENCE": "restaurant-api",
        "IDENTITY_INTROSPECTION_URL": "http://identity-service:3000/api/v1/auth/me",
        "INTERNAL_SERVICE_TOKEN_FILE": "/run/secrets/service_token",
        "PORT": 3000,
        "DB_HOST": "mysql",
        "DB_NAME": "menu_db",
        "DB_USER": "menu_app",
        "DB_PASSWORD_FILE": "/run/secrets/menu_db",
        "SEED_DEMO": "true"
      },
      "secrets": [
        "menu_db",
        "jwt_public",
        "service_token"
      ],
      "networks": [
        "data",
        "backend"
      ],
      "depends_on": {
        "db-init": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "payment-service": {
      "build": ".",
      "command": [
        "node",
        "services/payment/src/server.mjs"
      ],
      "environment": {
        "AUTH_MODE": "identity",
        "NODE_ENV": "development",
        "JWT_PUBLIC_KEY_FILE": "/run/secrets/jwt_public",
        "JWT_ISSUER": "restaurant-integrated",
        "JWT_AUDIENCE": "restaurant-api",
        "IDENTITY_INTROSPECTION_URL": "http://identity-service:3000/api/v1/auth/me",
        "INTERNAL_SERVICE_TOKEN_FILE": "/run/secrets/service_token",
        "PORT": 3000,
        "DB_HOST": "mysql",
        "DB_NAME": "payment_db",
        "DB_USER": "payment_app",
        "DB_PASSWORD_FILE": "/run/secrets/payment_db",
        "PAYMENT_DB_PASSWORD_FILE": "/run/secrets/payment_db",
        "ORDER_ADAPTER": "http",
        "TABLE_ADAPTER": "http",
        "ORDER_BASE_URL": "http://order-service:3000",
        "TABLE_BASE_URL": "http://reservation-service:3000",
        "TABLE_SERVICE_TOKEN_FILE": "/run/secrets/service_token",
        "ORDER_SERVICE_TOKEN_FILE": "/run/secrets/service_token",
        "VNPAY_CONFIG_FILE": "/run/secrets/vnpay_config",
        "SEED_VOUCHERS": "true"
      },
      "secrets": [
        "payment_db",
        "jwt_public",
        "service_token",
        "vnpay_config"
      ],
      "networks": [
        "data",
        "backend"
      ],
      "depends_on": {
        "db-init": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "reservation-service": {
      "build": ".",
