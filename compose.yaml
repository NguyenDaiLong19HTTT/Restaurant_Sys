      ],
      "restart": "no"
    },
    "browser-tests": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.tests"
      },
      "profiles": [
        "test"
      ],
      "environment": {
        "WEB_BASE_URL": "http://web:8080",
        "DEMO_PASSWORD_FILE": "/run/secrets/login_password"
      },
      "secrets": [
        "login_password"
      ],
      "networks": [
        "frontend",
        "backend"
      ],
      "shm_size": "1gb",
      "restart": "no"
    },
    "unit-tests": {
      "build": ".",
      "profiles": [
        "test"
      ],
      "command": [
        "npm",
        "run",
        "test:unit"
      ],
      "tmpfs": [
        "/app/test-results:mode=1777"
      ],
      "restart": "no"
    }
  },
  "networks": {
    "data": {
      "internal": true
    },
    "backend": {},
    "frontend": {}
  },
  "volumes": {
    "integrated_data": {}
  },
  "secrets": {
    "root_password": {
      "file": "./.local/root-password"
    },
    "identity_db": {
      "file": "./.local/identity-db"
    },
    "menu_db": {
      "file": "./.local/menu-db"
    },
    "payment_db": {
      "file": "./.local/payment-db"
    },
    "reservation_db": {
      "file": "./.local/reservation-db"
    },
    "inventory_db": {
      "file": "./.local/inventory-db"
    },
    "staff_db": {
      "file": "./.local/staff-db"
    },
    "schedule_db": {
      "file": "./.local/schedule-db"
    },
    "jwt_public": {
      "file": "./.local/jwt-public.pem"
    },
    "jwt_private": {
      "file": "./.local/jwt-private.pem"
    },
    "service_token": {
      "file": "./.local/service-token"
    },
    "login_password": {
      "file": "./.local/login-password"
    },
    "vnpay_config": {
      "file": "./.local/vnpay.json"
    },
    "order_db": {
      "file": "./.local/order-db"
    }
  }
}
