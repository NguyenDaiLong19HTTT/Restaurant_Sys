        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "schedule-service": {
      "build": ".",
      "command": [
        "node",
        "scripts/run.cjs",
        "schedule"
      ],
      "environment": {
        "AUTH_MODE": "identity",
        "NODE_ENV": "development",
        "JWT_PUBLIC_KEY_FILE": "/run/secrets/jwt_public",
        "JWT_ISSUER": "restaurant-integrated",
        "JWT_AUDIENCE": "restaurant-api",
        "IDENTITY_INTROSPECTION_URL": "http://identity-service:3000/api/v1/auth/me",
        "INTERNAL_SERVICE_TOKEN_FILE": "/run/secrets/service_token",
        "PORT": 3000,
        "DB_HOST": "mysql",
        "DB_NAME": "schedule_db",
        "DB_USER": "schedule_app",
        "DB_PASSWORD_FILE": "/run/secrets/schedule_db",
        "MYSQL_HOST": "mysql",
        "MYSQL_USER": "schedule_app",
        "MYSQL_PASSWORD_FILE": "/run/secrets/schedule_db",
        "IDENTITY_URL": "http://identity-service:3000",
        "SCHEDULE_URL": "http://schedule-service:3000",
        "STAFF_URL": "http://staff-service:3000",
        "BRANCH_BASE_URL": "http://reservation-service:3000",
        "INTERNAL_API_KEY_FILE": "/run/secrets/service_token"
      },
      "secrets": [
        "schedule_db",
        "jwt_public",
        "service_token"
      ],
      "networks": [
        "data",
        "backend"
      ],
      "depends_on": {
        "db-init": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "api-gateway": {
      "build": ".",
      "command": [
        "node",
        "apps/api-gateway/server.mjs"
      ],
      "environment": {
        "AUTH_MODE": "identity",
        "NODE_ENV": "development",
        "JWT_PUBLIC_KEY_FILE": "/run/secrets/jwt_public",
        "JWT_ISSUER": "restaurant-integrated",
        "JWT_AUDIENCE": "restaurant-api",
        "IDENTITY_INTROSPECTION_URL": "http://identity-service:3000/api/v1/auth/me",
        "INTERNAL_SERVICE_TOKEN_FILE": "/run/secrets/service_token",
        "PORT": 3000,
        "DB_HOST": "mysql",
        "MENU_BASE_URL": "http://menu-service:3000",
        "PAYMENT_BASE_URL": "http://payment-service:3000",
        "IDENTITY_BASE_URL": "http://identity-service:3000"
      },
      "secrets": [
        "jwt_public"
      ],
      "networks": [
        "backend",
        "frontend"
      ],
      "ports": [
        "127.0.0.1:${API_PORT}:3000"
      ],
      "depends_on": {
        "identity-service": {
          "condition": "service_healthy"
        },
        "menu-service": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "web": {
      "build": "./apps/web",
      "networks": [
        "frontend"
      ],
      "ports": [
        "127.0.0.1:${WEB_PORT}:8080"
      ],
      "depends_on": {
        "api-gateway": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped"
    },
    "order-service": {
      "build": ".",
      "command": [
        "node",
        "scripts/run.cjs",
        "order"
      ],
      "environment": {
