      ],
      "networks": [
        "data",
        "backend"
      ],
      "depends_on": {
        "db-init": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "staff-service": {
      "build": ".",
      "command": [
        "node",
        "scripts/run.cjs",
        "staff"
