        "IDENTITY_INTROSPECTION_URL": "http://identity-service:3000/api/v1/auth/me",
        "INTERNAL_SERVICE_TOKEN_FILE": "/run/secrets/service_token",
        "PORT": 3000,
        "DB_HOST": "mysql",
        "DB_NAME": "inventory_db",
        "DB_USER": "inventory_app",
        "DB_PASSWORD_FILE": "/run/secrets/inventory_db",
        "SEED_DEMO_DATA": "true",
        "BRANCH_BASE_URL": "http://reservation-service:3000",
        "ORDER_BASE_URL": "http://order-service:3000"
      },
      "secrets": [
        "inventory_db",
