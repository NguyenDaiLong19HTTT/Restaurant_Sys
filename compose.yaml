        "timeout": "4s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "table-fault-proxy": {
      "build": ".",
      "profiles": [
        "test"
      ],
      "command": [
        "node",
        "tests/table-fault-proxy.mjs"
      ],
      "secrets": [
        "service_token"
      ],
      "networks": [
        "backend"
      ],
      "restart": "no"
    },
    "payment-tests": {
      "build": ".",
      "profiles": [
        "test"
      ],
      "command": [
        "node",
        "--test",
        "--test-concurrency=1",
        "tests/payment.unit.test.mjs",
        "tests/payment.integration.test.mjs"
      ],
      "environment": {
        "AUTH_MODE": "development",
        "NODE_ENV": "development",
        "JWT_PUBLIC_KEY_FILE": "/run/secrets/jwt_public",
        "JWT_ISSUER": "restaurant-integrated",
        "JWT_AUDIENCE": "restaurant-api",
        "IDENTITY_INTROSPECTION_URL": "http://identity-service:3000/api/v1/auth/me",
