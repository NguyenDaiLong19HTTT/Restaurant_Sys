        "PORT": 3000,
        "DB_HOST": "mysql",
        "DB_NAME": "reservation_db",
        "DB_USER": "reservation_app",
        "DB_PASSWORD_FILE": "/run/secrets/reservation_db",
        "SEED_DEMO_DATA": "true",
        "BRANCH_BASE_URL": "http://reservation-service:3000",
        "ORDER_BASE_URL": "http://order-service:3000"
      },
      "secrets": [
        "reservation_db",
        "jwt_public",
        "service_token"
      ],
      "networks": [
        "data",
        "backend"
      ],
      "depends_on": {
