# Template only: configure your real TLS host/certificates outside this repository.
# Upstream is the existing local Gateway, never MySQL or a Docker socket.
server {
    listen 443 ssl;
    server_name YOUR-DEMO-DOMAIN;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    location = /api/v1/payments/vnpay/ipn {
        limit_except GET { deny all; }
        access_log off;
        proxy_pass http://127.0.0.1:19081;
    }
    location = /app/thanh-toan/ket-qua {
        access_log off;
        default_type text/html;
        charset utf-8;
        return 200 '<!doctype html><html lang="vi"><meta charset="utf-8"><title>Thanh toán thử nghiệm</title><h1>Đã trở về từ VNPay Sandbox</h1><p>Trang này chỉ hiển thị. Nhân viên cần kiểm tra IPN/QueryDR và xác nhận trên ứng dụng nhà hàng trước khi lập hóa đơn.</p></html>';
    }
    location / { return 404; }
}
