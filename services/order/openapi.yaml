openapi: 3.0.3
info:
  title: Restaurant Order Service
  version: 1.0.0
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/orders:
    get:
      summary: List orders visible to the current user
      parameters:
        - { in: query, name: branchId, schema: { type: string, format: uuid } }
        - { in: query, name: tableId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [DRAFT, SUBMITTED, HANDED_OVER, CANCELLED] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated order summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a draft order
      x-required-role: NHAN_VIEN_PHUC_VU
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses:
        '201':
          description: Draft order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}:
    get:
      summary: Get an order and its item snapshots
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/items:
    post:
      summary: Add a dish to a draft or submitted unpaid order; matching dishes increment the existing line
      x-required-role: NHAN_VIEN_PHUC_VU
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dishId, quantity]
              properties:
                dishId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        '200': { description: Updated order, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponse' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/items/{itemId}:
    patch:
      summary: Change the quantity of an item in a draft order
      x-required-role: NHAN_VIEN_PHUC_VU
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/OrderItemId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties: { quantity: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        '200': { description: Updated order, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponse' } } } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove an item from a draft order; submitted orders are append-only
      x-required-role: NHAN_VIEN_PHUC_VU
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/OrderItemId' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { description: Updated order, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponse' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/submit:
    post:
      summary: Confirm a draft order; existing lines are locked while additional items may still be appended before payment
      x-required-role: NHAN_VIEN_PHUC_VU
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Submitted order, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponse' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/handover:
    post:
      summary: Record handover of a submitted takeaway order
      x-required-role: NHAN_VIEN_TIEP_NHAN
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Handed-over order, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponse' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /internal/v1/orders/{id}/cancel:
    post:
      summary: Cancel a draft order while cancelling its reservation
      security:
        - internalServiceAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservationId]
              properties:
                reservationId: { type: string, format: uuid }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Order cancelled }
        '409': { $ref: '#/components/responses/Error' }
  /internal/v1/reservations/{reservationId}/orders:
    get:
      summary: List orders and cancellation eligibility for a reservation
      security:
        - internalServiceAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Related orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          type: object
                          required: [id, status, cancellable]
                          properties:
                            id: { type: string, format: uuid }
                            status: { type: string, enum: [DRAFT, SUBMITTED, HANDED_OVER, CANCELLED] }
                            cancellable: { type: boolean }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalServiceAuth:
      type: apiKey
      in: header
      name: X-Service-Token
  parameters:
    OrderId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    OrderItemId:
      in: path
      name: itemId
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string, example: '"3"' }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, maxLength: 128 }
  schemas:
    CreateOrder:
      type: object
      required: [branchId, serviceType, items]
      properties:
        branchId: { type: string, format: uuid }
        serviceType: { type: string, enum: [DINE_IN, TAKEAWAY] }
        tableId: { type: string, format: uuid, nullable: true }
        reservationId: { type: string, format: uuid, nullable: true }
        recipientName: { type: string, maxLength: 160, nullable: true }
        recipientPhone: { type: string, maxLength: 32, nullable: true }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 10000 }
    OrderItem:
      type: object
      required: [id, dishId, dishNameSnapshot, unitPriceVnd, quantity, lineTotalVnd]
      properties:
        id: { type: string, format: uuid }
        dishId: { type: string, format: uuid }
        dishNameSnapshot: { type: string }
        unitPriceVnd: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1 }
        lineTotalVnd: { type: integer, minimum: 1 }
    Order:
      type: object
      required: [id, code, branchId, serviceType, status, paymentStatus, totalVnd, version, items]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        branchId: { type: string, format: uuid }
        reservationId: { type: string, format: uuid, nullable: true }
        tableId: { type: string, format: uuid, nullable: true }
        serviceType: { type: string, enum: [DINE_IN, TAKEAWAY] }
        status: { type: string, enum: [DRAFT, SUBMITTED, HANDED_OVER, CANCELLED] }
        paymentStatus: { type: string, enum: [UNPAID, PAID] }
        totalVnd: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        payment: { type: object, nullable: true, properties: { amountVnd: { type: integer }, method: { type: string, enum: [CASH] }, receivedBy: { type: string }, paidAt: { type: string, format: date-time } } }
        takeaway: { type: object, nullable: true }
    OrderSummary:
      type: object
      required: [id, code, branchId, serviceType, status, paymentStatus, totalVnd, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        branchId: { type: string, format: uuid }
        reservationId: { type: string, format: uuid, nullable: true }
        tableId: { type: string, format: uuid, nullable: true }
        serviceType: { type: string, enum: [DINE_IN, TAKEAWAY] }
        status: { type: string, enum: [DRAFT, SUBMITTED, HANDED_OVER, CANCELLED] }
        paymentStatus: { type: string, enum: [UNPAID, PAID] }
        totalVnd: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Order' } }
    OrderListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
        meta:
          type: object
          required: [page, limit, total]
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
    ErrorBody:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        requestId: { type: string }
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
